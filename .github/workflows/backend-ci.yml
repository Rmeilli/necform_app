name: Backend CI

on:
  pull_request:
    paths:
      - 'necform/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'necform/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Check code style with Checkstyle
        run: |
          cd necform
          # Run Checkstyle if configuration exists
          if [ -f "checkstyle.xml" ]; then
            mvn checkstyle:check
          else
            echo "⚠️  No checkstyle.xml found, skipping Checkstyle validation"
          fi

      - name: Run SpotBugs for static analysis
        run: |
          cd necform
          mvn spotbugs:check || true
          echo "⚠️  SpotBugs check completed (warnings allowed)"

      - name: Build with Maven
        run: |
          cd necform
          mvn clean compile -DskipTests

      - name: Run unit tests
        run: |
          cd necform
          mvn test

      - name: Generate test coverage report
        run: |
          cd necform
          mvn jacoco:report

      - name: Check test coverage threshold
        run: |
          cd necform
          # Check if coverage meets minimum threshold (80%)
          if [ -f "target/site/jacoco/index.html" ]; then
            echo "✅ Coverage report generated"
            # You can add specific coverage checks here
            # For now, we just verify the report exists
          else
            echo "❌ Coverage report not generated"
            exit 1
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: necform/target/site/jacoco/
          retention-days: 7

      - name: Run integration tests
        run: |
          cd necform
          mvn verify -DskipUnitTests

      - name: Security scan with OWASP Dependency Check
        run: |
          cd necform
          mvn org.owasp:dependency-check-maven:check || true
          echo "⚠️  OWASP Dependency Check completed (warnings allowed)"

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: necform/target/dependency-check-report.html
          retention-days: 7

      - name: Build final package
        run: |
          cd necform
          mvn package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: necform/target/*.jar
          retention-days: 7

      - name: SonarQube analysis (optional)
        if: github.event_name == 'pull_request'
        run: |
          cd necform
          # Add SonarQube token to repository secrets if you want to enable this
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            mvn sonar:sonar \
              -Dsonar.projectKey=necform \
              -Dsonar.organization=necform \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          else
            echo "⚠️  SonarQube token not configured, skipping SonarQube analysis"
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 Backend CI Results\n\n';
            
            // Add test results
            comment += '### ✅ Tests Passed\n';
            comment += '- Unit tests: PASSED\n';
            comment += '- Integration tests: PASSED\n';
            comment += '- Build: SUCCESS\n\n';
            
            // Add coverage info
            comment += '### 📊 Code Coverage\n';
            comment += 'Coverage report has been generated and uploaded as an artifact.\n\n';
            
            // Add security scan info
            comment += '### 🔒 Security Scan\n';
            comment += 'OWASP Dependency Check completed. Review the uploaded artifact for details.\n\n';
            
            comment += '---\n';
            comment += '*This comment was automatically generated by GitHub Actions*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  backend-quality-gate:
    runs-on: ubuntu-latest
    needs: backend-check
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Quality gate check
        run: |
          echo "🎯 Performing quality gate checks..."
          
          # Check if backend checks passed
          if [ "${{ needs.backend-check.result }}" != "success" ]; then
            echo "❌ Quality gate failed: Backend checks did not pass"
            exit 1
          fi
          
          echo "✅ Quality gate passed"
          echo ""
          echo "Summary:"
          echo "- Code style: Validated"
          echo "- Static analysis: Completed"
          echo "- Tests: Passed"
          echo "- Security scan: Completed"
          echo "- Build: Successful"