<div class="entreprises-container">
  <div class="header">
    <h1>Entreprises</h1>
    <button class="btn-primary" (click)="showCreateForm()">+ Nouvelle Entreprise</button>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
    <button class="close-error" (click)="errorMessage = ''">×</button>
  </div>

  <div *ngIf="isLoading" class="loading">
    <div class="spinner"></div>
    <p>Chargement...</p>
  </div>

  <div *ngIf="!isLoading" class="table-container">
    <table class="entreprises-table">
      <thead>
        <tr>
          <th>Raison Sociale</th>
          <th>Adresse</th>
          <th>Téléphone</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let entreprise of entreprises">
          <td>{{ entreprise.raisonSociale }}</td>
          <td>{{ entreprise.adresse }}</td>
          <td>{{ entreprise.telephone }}</td>
          <td>{{ entreprise.email }}</td>
          <td class="actions">
            <button class="btn-edit" (click)="showEditForm(entreprise)">✏️</button>
            <button class="btn-delete" (click)="deleteEntreprise(entreprise.id)">🗑️</button>
          </td>
        </tr>
        <tr *ngIf="entreprises.length === 0">
          <td colspan="5" class="no-data">Aucune entreprise trouvée</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="showForm" class="modal-overlay" (click)="closeForm()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ isEditing ? 'Modifier' : 'Nouvelle' }} Entreprise</h2>
        <button class="btn-close" (click)="closeForm()">×</button>
      </div>
      <form class="modal-body" (submit)="submitForm()">
        <div class="form-group">
          <label>Raison Sociale *</label>
          <input type="text" [(ngModel)]="formData.raisonSociale" name="raisonSociale" required>
        </div>
        <div class="form-group">
          <label>Adresse</label>
          <input type="text" [(ngModel)]="formData.adresse" name="adresse">
        </div>
        <div class="form-group">
          <label>Téléphone</label>
          <input type="text" [(ngModel)]="formData.telephone" name="telephone">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="formData.email" name="email">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" (click)="closeForm()">Annuler</button>
          <button type="submit" class="btn-primary">{{ isEditing ? 'Modifier' : 'Créer' }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
