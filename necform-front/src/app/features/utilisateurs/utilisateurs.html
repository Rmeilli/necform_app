<div class="utilisateurs-container">
  <div class="header">
    <h1>Utilisateurs</h1>
    <button class="btn-primary" (click)="showCreateForm()">+ Nouvel Utilisateur</button>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
    <button class="close-error" (click)="errorMessage = ''">×</button>
  </div>

  <div *ngIf="isLoading" class="loading">
    <div class="spinner"></div>
    <p>Chargement...</p>
  </div>

  <div *ngIf="!isLoading" class="table-container">
    <table class="utilisateurs-table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Email</th>
          <th>Type</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let utilisateur of utilisateurs">
          <td>{{ utilisateur.nom }}</td>
          <td>{{ utilisateur.prenom }}</td>
          <td>{{ utilisateur.email }}</td>
          <td>
            <span class="type-badge">{{ getTypeLabel(utilisateur.type) }}</span>
          </td>
          <td class="actions">
            <button class="btn-edit" (click)="showEditForm(utilisateur)">✏️</button>
            <button class="btn-delete" (click)="deleteUtilisateur(utilisateur.id)">🗑️</button>
          </td>
        </tr>
        <tr *ngIf="utilisateurs.length === 0">
          <td colspan="5" class="no-data">Aucun utilisateur trouvé</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="showForm" class="modal-overlay" (click)="closeForm()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ isEditing ? 'Modifier' : 'Nouvel' }} Utilisateur</h2>
        <button class="btn-close" (click)="closeForm()">×</button>
      </div>
      <form class="modal-body" (submit)="submitForm()">
        <div class="form-group">
          <label>Keycloak User ID *</label>
          <input type="text" [(ngModel)]="formData.keycloakUserId" name="keycloakUserId" required>
        </div>
        <div class="form-group">
          <label>Nom *</label>
          <input type="text" [(ngModel)]="formData.nom" name="nom" required>
        </div>
        <div class="form-group">
          <label>Prénom *</label>
          <input type="text" [(ngModel)]="formData.prenom" name="prenom" required>
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" [(ngModel)]="formData.email" name="email" required>
        </div>
        <div class="form-group">
          <label>Type *</label>
          <select [(ngModel)]="formData.type" name="type" required>
            <option [value]="TypeUtilisateur.ADMIN">Admin</option>
            <option [value]="TypeUtilisateur.FORMATEUR">Formateur</option>
            <option [value]="TypeUtilisateur.APPRENANT">Apprenant</option>
            <option [value]="TypeUtilisateur.ENTREPRISE">Entreprise</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" (click)="closeForm()">Annuler</button>
          <button type="submit" class="btn-primary">{{ isEditing ? 'Modifier' : 'Créer' }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
