<div class="category-card" [class.selected]="isSelected" (click)="onClick()">
  <div class="category-icon" [style.background-color]="category.color">
    {{ category.icon }}
  </div>
  <div class="category-info">
    <h3 class="category-name">{{ category.name }}</h3>
    <p class="category-count">{{ category.count }} formation{{ category.count !== 1 ? 's' : '' }}</p>
  </div>
</div>
