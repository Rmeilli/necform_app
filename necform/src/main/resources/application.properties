spring.application.name=necform
#spring.docker.compose.enabled=false

necform
# PostgreSQL

spring.datasource.url=jdbc:postgresql://localhost:5432/necform
spring.datasource.username=necform
spring.datasource.password=necform

# JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# D�sactive Docker Compose

spring.docker.compose.enabled=false

# Serveur

server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/necform


#########################
# GEMINI
#########################

gemini.api.key=${GEMINI_API_KEY}

gemini.model=gemini-2.5-flash

