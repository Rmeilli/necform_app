# Configuration H2 pour les tests
# Utilise une base de données en mémoire pour éviter d'avoir besoin de PostgreSQL

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecte H2 pour Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Désactiver l'initialisation SQL
spring.sql.init.mode=never

# Désactiver Keycloak pour les tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# Désactiver Docker Compose
spring.docker.compose.enabled=false